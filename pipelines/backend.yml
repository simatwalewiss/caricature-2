trigger:
  branches:
    include: [main]
  paths:
    include:
      - backend/*
      - pipelines/backend.yml

pr: none

pool:
  vmImage: ubuntu-latest

variables:
  azureSubscription: 'azure-caricature'
  appName: 'caricature'            # backend App Service name

steps:
  - task: NodeTool@0
    displayName: Use Node 20
    inputs:
      versionSpec: '20.x'

  - script: npm ci --omit=dev
    displayName: Install production dependencies
    workingDirectory: backend

  - task: ArchiveFiles@2
    displayName: Zip backend
    inputs:
      rootFolderOrFile: '$(System.DefaultWorkingDirectory)/backend'
      includeRootFolder: false
      archiveType: zip
      archiveFile: '$(Build.ArtifactStagingDirectory)/backend.zip'
      replaceExistingArchive: true

  - task: AzureWebApp@1
    displayName: Deploy to backend App Service
    inputs:
      azureSubscription: '$(azureSubscription)'
      appType: webAppLinux
      appName: '$(appName)'
      package: '$(Build.ArtifactStagingDirectory)/backend.zip'